name: iOS Chiaki Core Build

# Requires a configured self-hosted macOS runner with Xcode and an iOS-arm64
# dependency prefix exported as IOS_DEPS_PREFIX in the runner environment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-arm64-core:
    name: Configure and build iOS arm64 protocol core
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host build tools
        run: |
          xcode-select -p
          xcodebuild -version
          brew install cmake protobuf

      - name: Build iOS device protocol core
        run: |
          test -n "$IOS_DEPS_PREFIX"
          chmod +x scripts/build-ios-core.sh
          ./scripts/build-ios-core.sh
